<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found | Draken</title>
    <meta name="robots" content="noindex" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #050806;
        color: #c7d1cc;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(57,255,136,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(57,255,136,0.05) 1px, transparent 1px);
        background-size: 64px 64px;
        animation: drift 24s linear infinite;
      }
      @keyframes drift {
        from { background-position: 0 0; }
        to { background-position: 64px 64px; }
      }
      .card {
        position: relative;
        text-align: center;
        padding: 48px 40px;
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 28px;
        background: rgba(8,13,10,0.85);
        backdrop-filter: blur(14px);
        max-width: 480px;
        width: 90%;
        box-shadow: 0 0 80px rgba(57,255,136,0.06);
        animation: rise 800ms cubic-bezier(0.16,1,0.3,1);
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 92px;
        font-weight: 500;
        letter-spacing: -0.05em;
        color: #39ff88;
        line-height: 1;
        text-shadow: 0 0 60px rgba(57,255,136,0.35);
      }
      .eyebrow {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #8b9690;
        margin-bottom: 14px;
      }
      h1 { font-size: 22px; color: #f5f7fa; margin-top: 10px; font-weight: 600; }
      p { font-size: 14px; line-height: 1.7; color: #8b9690; margin-top: 12px; }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 13px 30px;
        border-radius: 999px;
        background: #f5f7fa;
        color: #080d0a;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: all 300ms ease;
      }
      a:hover { background: #fff; box-shadow: 0 6px 24px rgba(57,255,136,0.18); }
      .brand {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.3em;
        color: #39ff88;
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="card">
      <p class="eyebrow">Error / Signal lost</p>
      <div class="code">404</div>
      <h1>This page doesn&apos;t exist.</h1>
      <p>The node you&apos;re looking for drifted off the grid. Head back home and find your way from there.</p>
      <a href="https://portfolio-black-delta-78.vercel.app/">Back to home</a>
      <p class="brand">DRΛKEN</p>
    </div>
  </body>
</html>
